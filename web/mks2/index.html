<!doctype html>
<html lang="ko" data-theme="light">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ontologics · MK-S2 작업 공간</title>
  <link rel="stylesheet" href="./styles.css">
  <link rel="stylesheet" href="./dashboard.css">
  <link rel="stylesheet" href="./graph.css">
  <link rel="stylesheet" href="./twin.css">
  <script type="module" src="./app.js"></script>
</head>
<body>
  <div class="application">
    <header class="topbar">
      <div class="brand"><span class="brand-mark" aria-hidden="true"></span>ontologics <span class="tag">MK-S2 · 원장 조회</span></div>
      <nav class="tabs" aria-label="화면">
        <a href="#graph" id="tab-graph">온톨로지 · 질의</a>
        <a href="#dashboard" id="tab-dashboard">운영 대시보드</a>
        <a href="#twin" id="tab-twin">디지털 트윈</a>
      </nav>
      <span class="sp"></span>
      <div id="versions" class="version" aria-label="조회 기준">자료 읽는 중</div>
      <label class="role-label">역할 <select id="actor" disabled title="서버의 개발 계정을 선택합니다."><option>미연결</option></select></label>
      <button class="btn sm" id="theme" type="button" aria-label="어두운 테마로 전환">테마</button>
      <button class="btn sm" id="reset" type="button" title="화면 선택과 대화만 초기화합니다">초기화</button>
    </header>
    <main id="workspace" aria-busy="true">
      <div id="load-state" class="load-state" role="status">서버 연결과 현재 계정을 확인하고 있습니다.</div>
      <section id="graph-view" class="screen graph-screen" aria-label="온톨로지와 질의" hidden>
        <div id="graph-stage"></div><aside id="graph-panel" class="assistant-panel" aria-label="업무 AI 질의"></aside>
      </section>
      <section id="dashboard-view" class="screen dashboard-screen" aria-label="운영 대시보드" hidden>
        <div id="dashboard-stage"></div><aside id="dashboard-panel" class="assistant-panel" aria-label="업무 에이전트"></aside>
      </section>
      <section id="twin-view" class="screen graph-screen twin-screen" aria-label="디지털 트윈" hidden>
        <div id="twin-stage"></div><aside id="twin-panel" class="assistant-panel" aria-label="디지털 트윈 질의"></aside>
      </section>
    </main>
  </div>
  <div id="notice" class="notice" role="status" aria-live="polite" hidden></div>
</body>
</html>
